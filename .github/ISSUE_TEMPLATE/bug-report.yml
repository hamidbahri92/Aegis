name: Bug report
description: Report a reproducible Aegis QEC defect or incorrect result.
title: "[Bug] "
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the incorrect behavior and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Provide the smallest command or code sample that reproduces the problem.
      render: shell
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Environment
      description: Paste the output of aegis doctor --json.
      render: json
    validations:
      required: true

  - type: textarea
    id: artifacts
    attributes:
      label: Logs or research artifacts
      description: Attach relevant JSON, CSV, traceback, circuit, DEM, or screenshots.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have included a deterministic seed when randomness is involved.
          required: true
        - label: I have not included secrets, API tokens, or private hardware data.
          required: true
