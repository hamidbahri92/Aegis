name: aegis-qec-ci
on:
  push:
    branches: [main, master, v13]
  pull_request: {}

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[full]" pytest ruff
      - run: python -m ruff check .
      - run: python -m pytest -q
      - name: Verify production MWPM backend
        run: python -c "from a3d.decoder_mwpm import MWPMDecoder; assert MWPMDecoder.backend == 'pymatching-sparse-blossom'"
