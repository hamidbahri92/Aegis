name: aegis-qec-ci
on:
  push:
    branches: [main, master, v13]
  pull_request: {}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[full,gui]" pytest ruff
      - name: Real-defect lint across repository
        run: python -m ruff check --select F,B .
      - name: Strict lint for Aegis QEC 1.1 surfaces
        run: >-
          python -m ruff check
          a3d/decoder_mwpm.py
          a3d/decoder_mwpm_pm.py
          a3d/config.py
          aegis_qec
          bench/cli.py
          gui/app.py
          tests/test_mwpm_sparse_blossom.py
          tests/test_public_namespace.py
          tests/test_decode_from_dem_optional.py
      - run: python -m pytest -q
      - name: Verify production MWPM backend
        run: python -c "from a3d.decoder_mwpm import MWPMDecoder; assert MWPMDecoder.backend == 'pymatching-sparse-blossom'"
      - name: Verify installed CLI entry points
        run: |
          aegis-bench --help
          aegis-gui --help || true
