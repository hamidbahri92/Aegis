name: aegis-qec-ci

concurrency:
  group: aegis-qec-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[full,gui]" pytest ruff
      - name: Repository defect lint
        run: python -m ruff check --select F,B .
      - name: Strict lint for Aegis QEC release surfaces
        run: >-
          python -m ruff check
          a3d/decoder_mwpm.py
          a3d/decoder_mwpm_pm.py
          a3d/stim_adapter.py
          a3d/config.py
          aegis_qec
          bench/cli.py
          gui/app.py
          scripts/run_gui.py
          tests/test_cli.py
          tests/test_calibration_advantage.py
          tests/test_circuit_acceptance.py
          tests/test_mwpm_sparse_blossom.py
          tests/test_public_namespace.py
          tests/test_platform_campaign.py
          tests/test_hardware_provenance.py
          tests/test_experiment_manifest.py
          tests/test_decoder_plugin_sdk.py
          tests/test_headless_plotting.py
          tests/test_template_catalog.py
          tests/test_dataset.py
          tests/test_dataset_evaluation.py
          tests/test_research_project.py
          tests/test_submission_package.py
          tests/test_discovery.py
          tests/test_scaling_analysis.py
          tests/test_shot_explainer.py
          tests/test_decode_from_dem_optional.py
          tests/test_stim_adapter_deprecation.py
      - name: Run tests
        run: python -m pytest -q
      - name: Verify production MWPM backend
        run: python -c "from a3d.decoder_mwpm import MWPMDecoder; assert MWPMDecoder.backend == 'pymatching-sparse-blossom'"
      - name: Verify user-facing commands
        run: |
          aegis --help
          aegis --version
          aegis doctor --json
          aegis demo --distance 3 --rounds 3 --error-probability 0
          aegis study --distance 3 --p 0.02 --shots 32 --basis x --seed 1234 --out-json research_out/smoke.json --out-csv research_out/smoke.csv --plot research_out/smoke.png
          aegis decoders
          aegis validate-decoder aegis-pymatching --json
          aegis compare --decoder aegis-pymatching --distance 3 --p 0.02 --shots 32 --seed 1234 --out-json research_out/compare.json
          aegis explain --distance 3 --p 0.02 --seed 1234 --out-json research_out/explain.json --plot research_out/explain.png
          aegis experiment examples/experiment-smoke.json --output-dir research_out/manifest-smoke --bundle research_out/manifest-smoke.aegis.zip
          aegis verify-bundle research_out/manifest-smoke.aegis.zip
          aegis templates --json
          aegis init-experiment shot-explanation --out research_out/template-smoke.json
          aegis dataset generate --out research_out/dataset-smoke.h5 --shots 24 --seed 1234 --chunk-size 8 --distance 3 --p 0.02 --json
          aegis dataset inspect research_out/dataset-smoke.h5 --json
          aegis dataset evaluate research_out/dataset-smoke.h5 --decoder aegis-pymatching aegis-pymatching-correlated --split all --out-json research_out/dataset-evaluation-smoke.json --json
          aegis project init --out research_out/project-smoke.json --author "CI Researcher"
          aegis project freeze research_out/project-smoke.json
          aegis project audit research_out/project-smoke.json --require-protocol-lock --json
          aegis paper build research_out/project-smoke.json --out research_out/submission-smoke --compile never --require-protocol-lock
          aegis paper verify research_out/submission-smoke.zip --json
          aegis discover init --out research_out/discovery-smoke.json
          aegis-bench --help
          aegis-bench circuit-acceptance --distance 3 --rounds 3 --shots 32 --p 0.02 --seed 1234
          aegis-bench calibration-advantage --shots 2000 --seed 20260928 --out-json bench_out/calibration_advantage.json --plot bench_out/calibration_advantage.png

  campaign-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[full]"
      - name: Run resumable Sinter campaign smoke test
        run: >-
          aegis campaign
          --distance 3
          --p 0.02
          --decoder pymatching aegis-pymatching
          --workers 1
          --max-shots 32
          --max-errors 8
          --resume research_out/campaign-smoke.csv
          --out-json research_out/campaign-smoke.json
          --plot research_out/campaign-smoke.png
          --quiet
      - name: Resume campaign from durable CSV
        run: >-
          aegis campaign
          --distance 3
          --p 0.02
          --decoder pymatching aegis-pymatching
          --workers 1
          --max-shots 32
          --max-errors 8
          --resume research_out/campaign-smoke.csv
          --out-json research_out/campaign-smoke-resumed.json
          --plot research_out/campaign-smoke-resumed.png
          --quiet

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build twine
      - name: Build release artifacts
        run: python -m build
      - name: Validate package metadata and README rendering
        run: python -m twine check dist/*
      - name: Install built wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Smoke-test installed package
        run: |
          aegis --version
          aegis doctor --json
          aegis templates --json
          aegis init-experiment shot-explanation --out wheel-template-smoke.json
          aegis project init --out wheel-project.json --author "Wheel CI"
          aegis project freeze wheel-project.json
          aegis project audit wheel-project.json --require-protocol-lock --json
          aegis paper build wheel-project.json --out wheel-submission --compile never --require-protocol-lock
          aegis paper verify wheel-submission.zip --json
          aegis discover init --out wheel-discovery.json
          python -c "import aegis_qec; assert aegis_qec.__version__ == '1.2.0'"
