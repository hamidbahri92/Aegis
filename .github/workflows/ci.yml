name: aegis-qec-ci

on:
  push:
    branches: [main, master, v13]
  pull_request: {}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[full,gui]" pytest ruff
      - name: Repository defect lint
        run: python -m ruff check --select F,B .
      - name: Strict lint for Aegis QEC release surfaces
        run: >-
          python -m ruff check
          a3d/decoder_mwpm.py
          a3d/decoder_mwpm_pm.py
          a3d/config.py
          aegis_qec
          bench/cli.py
          gui/app.py
          scripts/run_gui.py
          tests/test_cli.py
          tests/test_mwpm_sparse_blossom.py
          tests/test_public_namespace.py
          tests/test_decode_from_dem_optional.py
      - name: Run tests
        run: python -m pytest -q
      - name: Verify production MWPM backend
        run: python -c "from a3d.decoder_mwpm import MWPMDecoder; assert MWPMDecoder.backend == 'pymatching-sparse-blossom'"
      - name: Verify user-facing commands
        run: |
          aegis --help
          aegis --version
          aegis doctor --json
          aegis demo --distance 3 --rounds 3 --error-probability 0
          aegis-bench --help

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build twine
      - name: Build release artifacts
        run: python -m build
      - name: Validate package metadata and README rendering
        run: python -m twine check dist/*
      - name: Install built wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Smoke-test installed package
        run: |
          aegis --version
          aegis doctor --json
          python -c "import aegis_qec; assert aegis_qec.__version__ == '1.1.0'"
