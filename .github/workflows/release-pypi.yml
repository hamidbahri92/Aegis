name: Release (PyPI)

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate package metadata and long description
        run: python -m twine check dist/*
      - name: Install and smoke-test the built wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          aegis --version
          aegis doctor --json
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python -c
          "import importlib.metadata as m, os;
          expected = os.environ['RELEASE_TAG'].removeprefix('v');
          actual = m.version('aegis-qec');
          assert actual == expected, f'tag {expected} != package {actual}'"
      - name: Preserve validated distributions for the publish job
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish validated distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Retrieve validated distributions
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
