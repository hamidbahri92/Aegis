[project]
name = "aegis-qec"
version = "1.0.15"
description = "Aegis: Hardware-Aware Quantum Error Correction Platform"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Hamid bahri" }]

dependencies = [
  "numpy>=1.21",
  "networkx>=3.0,<4.0",
]

[project.optional-dependencies]
accel = [
  "numba>=0.58",
]

ml = [
  "torch>=2.1; platform_system!='Emscripten'",
]

full = [
  "matplotlib>=3.5",
  "pyarrow>=10.0",
  "pytest>=7.0",
]
mwpm = [
  "networkx>=3.0,<4.0"
]

[project.urls]
Repository = "https://github.com/hamidbahri92/Aegis"

[project.scripts]
aegis-gui = "scripts.run_gui:main"
aegis-autobench = "bench.auto_bench:main"
aegis-bench = "bench.cli:main"
aegis-train-transformer = "scripts.train_transformer:main"
aegis-ci = "ci_runner:main"
aegis-run = "main:main"
aegis-metrics = "main_metrics:main"
aegis-threshold = "main_threshold:main"
aegis-export-header = "main_export_header:main"

# Ã˜ÂªÃ˜Â¶Ã™â€¦Ã›Å’Ã™â€  Ã˜Â§Ã›Å’Ã™â€ ÃšÂ©Ã™â€¡ a3d Ã˜Â¨Ã™â€¡Ã˜Â¹Ã™â€ Ã™Ë†Ã˜Â§Ã™â€  Ã™Â¾ÃšÂ©Ã›Å’Ã˜Â¬ Ã™Ë† Ã˜Â§Ã˜Â³ÃšÂ©Ã˜Â±Ã›Å’Ã™Â¾Ã˜ÂªÃ™â€¡Ã˜Â§Ã›Å’ Ã˜Â³Ã˜Â·Ã˜Â­-Ã˜Â±Ã›Å’Ã˜Â´Ã™â€¡ Ã˜Â¯Ã˜Â§Ã˜Â®Ã™â€ž wheel Ã˜Â¨Ã›Å’Ã˜Â§Ã›Å’Ã™â€ Ã˜Â¯
[tool.setuptools]
include-package-data = true
py-modules = ["main", "main_metrics", "main_threshold", "main_export_header"]

[tool.setuptools.packages.find]
include = ["a3d*"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
