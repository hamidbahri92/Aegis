[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-qec"
version = "1.2.0"
description = "End-to-end quantum error correction research platform: surface-code simulation, decoder benchmarking, evolutionary experiment search, evidence auditing, and LaTeX papers."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hamid Bahri" }]
keywords = [
  "quantum-error-correction",
  "qec",
  "surface-code",
  "rotated-surface-code",
  "quantum-decoding",
  "mwpm",
  "minimum-weight-perfect-matching",
  "sparse-blossom",
  "pymatching",
  "stim",
  "sinter",
  "monte-carlo",
  "research-platform",
  "reproducible-research",
  "research-software",
  "adaptive-experiment-design",
  "multi-objective-optimization",
  "scientific-workflow",
  "research-reproducibility",
  "latex",
  "artifact-evaluation",
  "detector-error-model",
  "fault-tolerant-quantum-computing",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
  "numpy>=1.21.0",
  "pymatching>=2.4,<3",
  "matplotlib>=3.5.0",
]

[project.optional-dependencies]
full = [
  "h5py>=3.9",
  "pyarrow>=10.0.0",
  "stim>=1.16,<2",
  "sinter>=1.16,<2",
]
dev = [
  "build>=1.2",
  "h5py>=3.9",
  "pytest>=7.0.0",
  "ruff>=0.6",
  "stim>=1.16,<2",
  "sinter>=1.16,<2",
]
gui = [
  "streamlit>=1.50",
]

[project.urls]
Homepage = "https://github.com/hamidbahri92/Aegis"
Documentation = "https://github.com/hamidbahri92/Aegis#readme"
Repository = "https://github.com/hamidbahri92/Aegis"
Issues = "https://github.com/hamidbahri92/Aegis/issues"
Changelog = "https://github.com/hamidbahri92/Aegis/blob/main/CHANGELOG.md"
Citation = "https://github.com/hamidbahri92/Aegis/blob/main/CITATION.cff"
Research = "https://github.com/hamidbahri92/Aegis/blob/main/docs/RESEARCH_GUIDE.md"
"Decoder SDK" = "https://github.com/hamidbahri92/Aegis/blob/main/docs/DECODER_PLUGINS.md"
Discovery = "https://github.com/hamidbahri92/Aegis/blob/main/docs/DISCOVERY.md"
"Research Projects" = "https://github.com/hamidbahri92/Aegis/blob/main/docs/RESEARCH_PROJECTS.md"
PyPI = "https://pypi.org/project/aegis-qec/"

[project.scripts]
aegis = "aegis_qec.cli:main"
aegis-run = "main:main"
aegis-metrics = "main_metrics:main"
aegis-threshold = "main_threshold:main"
aegis-export-header = "main_export_header:main"
aegis-ci = "ci_runner:main"
aegis-bench = "bench.cli:main"
aegis-gui = "scripts.run_gui:main"

[tool.setuptools]
py-modules = ["main", "main_metrics", "main_threshold", "main_export_header", "ci_runner"]

[tool.setuptools.packages.find]
where = ["."]
include = ["a3d*", "aegis_qec*", "bench*", "gui*", "scripts*"]


[tool.setuptools.package-data]
aegis_qec = ["templates/*.json"]
